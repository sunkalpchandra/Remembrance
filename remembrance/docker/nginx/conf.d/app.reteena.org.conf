# Nginx site configuration for app.reteena.org
#
# - Serves ACME http-01 challenge from /var/www/certbot (host bind to ./docker/nginx/www)
# - Redirects HTTP -> HTTPS
# - Proxies application traffic to `web:3000`
# - Proxies backend API traffic to `backend:4000`
#
# Place this file at: remembrance/docker/nginx/conf.d/app.reteena.org.conf

# HTTP: respond to ACME challenges and redirect other traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.reteena.org;

    # Allow large challenge payloads if needed
    client_max_body_size 100M;

    # ACME challenge location - served from docker volume
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        access_log off;
        expires 1d;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server: proxy to internal services and serve ACME challenge
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.reteena.org;

    # SSL certificates created by certbot, mounted at /etc/letsencrypt
    ssl_certificate /etc/letsencrypt/live/app.reteena.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.reteena.org/privkey.pem;

    # Security / TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:\
ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:\
ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    # Basic security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Increase allowed body size for file uploads
    client_max_body_size 100M;

    # ACME challenge (still needed on HTTPS to support any ACME tooling that hits HTTPS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        access_log off;
        expires 1d;
    }

    # Health probe (optional) - forward to web app root or a specific health endpoint
    location = /nginx_health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Proxy static assets and everything else to the Next.js frontend (web service)
    # Next.js will serve static files and handle routing.
    location / {
        proxy_pass http://web:3000;

        # Proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket and upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts and buffering
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        send_timeout 60s;

        # Recommended for Next.js streaming/SSE
        proxy_buffering off;

        # Preserve Host header for Next.js apps if needed
        proxy_http_version 1.1;
    }

    # If your backend is exposed under /backend/ (adjust if using a different prefix)
    location /backend/ {
        # Keep trailing slash handling so proxied paths are forwarded correctly
        proxy_pass http://backend:4000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        send_timeout 60s;

        proxy_buffering off;
        proxy_http_version 1.1;
    }

    # Optional: catch common static files and let the web service handle them directly.
    # (Next.js will generally serve them when proxied to /)
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
}
