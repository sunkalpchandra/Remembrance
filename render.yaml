services:
  - type: web
    name: remembrance-backend
    runtime: node
    plan: free
    rootDir: remembrance
    buildCommand: npm install
    startCommand: npm run server:node
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: DIGITALOCEAN_KEY
        sync: false
      - key: HACKCLUB_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: NEO4J_URL
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false

  - type: web
    name: remembrance-frontend
    runtime: node
    plan: free
    rootDir: remembrance
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NEXT_PUBLIC_BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: NEXT_PUBLIC_PICOVOICE_ACCESS_KEY
        sync: false
