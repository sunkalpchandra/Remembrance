services:
  - type: web
    name: remembrance-backend
    runtime: python
    plan: free
    rootDir: remembrance/backend/mem0
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
      - key: MEMO_API_KEY
        sync: false

  - type: web
    name: remembrance-frontend
    runtime: node
    plan: free
    rootDir: remembrance
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: remembrance-backend
          property: host
